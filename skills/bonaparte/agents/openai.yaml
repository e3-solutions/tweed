interface:
  display_name: "Bonaparte"
  short_description: "Adversarial subagents from request to reviewed PR"
  default_prompt: "Use $bonaparte to deliver this bug or feature through blind investigation, evidence reconciliation, bounded implementation, and fresh adversarial review."
dependencies:
  tools:
    - type: "mcp"
      value: "linear"
      description: "Read and update Linear issues used as Bonaparte request records"
      transport: "streamable_http"
      url: "https://mcp.linear.app/mcp"
policy:
  allow_implicit_invocation: true
