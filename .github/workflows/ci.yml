name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate manifest
        run: python -m json.tool .codex-plugin/plugin.json >/dev/null
      - name: Compile
        run: python -m py_compile skills/confidence-protocol/scripts/*.py
      - name: Test
        run: python -m unittest discover -s skills/confidence-protocol/tests -v
      - name: Check release archive
        run: python skills/confidence-protocol/tests/check_release.py
      - name: Reject whitespace errors
        if: github.event_name == 'pull_request'
        run: git diff --check origin/${{ github.base_ref }}...HEAD
