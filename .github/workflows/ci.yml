name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Smoke-test runner
        run: |
          python -m py_compile bonaparte bonaparte-launcher autoresearch
          sh -n install
          ./bonaparte --help
          ./autoresearch --help
      - name: Test versioned installation and updates
        run: python -m unittest discover -s tests -v
      - name: Reject whitespace errors in the PR diff
        if: github.event_name == 'pull_request'
        run: git diff --check origin/${{ github.base_ref }}...HEAD
