name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install runner dependencies
        run: python -m pip install uv openai-codex==0.147.0
      - name: Smoke-test runner
        run: |
          python -m py_compile bonaparte
          sh -n install
          uv run --offline --script ./bonaparte --help
          ./autoresearch --help
      - name: Test runner and installation
        run: python -m unittest discover -s tests -v
      - name: Reject whitespace errors in the PR diff
        if: github.event_name == 'pull_request'
        run: git diff --check origin/${{ github.base_ref }}...HEAD
